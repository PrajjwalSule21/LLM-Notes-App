{% extends "base.html" %}

{% block title %}My Notebook 📓{% endblock %}

{% block content %}
  <h1>My Notebook 📓</h1>
  <div class="subtitle">-- all my LLM notes in one place --</div>

  <ul class="note-list">
    {% for note in notes %}
    <li>
      <a href="{{ note.url }}">{{ note.title }}</a>
      <span class="note-desc">{{ note.description }}</span>
    </li>
    {% endfor %}
  </ul>

  <hr>
  <p class="doodle">more topics coming soon...</p>
{% endblock %}
